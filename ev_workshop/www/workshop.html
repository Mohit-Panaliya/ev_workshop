<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="description" content="EV Workshop — job cards, status tracking and billing for the workshop floor.">

    <title>EV Workshop</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/ev_workshop/frontend/manifest/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/assets/ev_workshop/frontend/manifest/apple-touch-icon.png">
    <link rel="manifest" href="/assets/ev_workshop/frontend/manifest.webmanifest">

    <script type="module" crossorigin src="/assets/ev_workshop/frontend/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/ev_workshop/frontend/assets/index.css">

    <style>
        body { margin: 0; background: #f1f5f9; font-family: system-ui, sans-serif; }
        .initial-loader { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; flex-direction: column; gap: 16px; }
        .initial-loader .spinner { width: 32px; height: 32px; border: 3px solid rgba(29,78,216,.2); border-top-color: #1d4ed8; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app">
        <div class="initial-loader"><div class="spinner"></div></div>
    </div>

    <script>
        window.csrf_token = "{{ csrf_token }}";
        window.site_name = "{{ site_name }}";
        if (!window.frappe) window.frappe = {};
        frappe.boot = {{ boot }};
    </script>
</body>
</html>
