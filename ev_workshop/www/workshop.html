<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="EV Workshop — job cards, customers, counter sales, payments and analytics.">

    <title>EV Workshop</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/ev_workshop/frontend/manifest/favicon-32x32.png">

    <script type="module" crossorigin src="/assets/ev_workshop/frontend/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/ev_workshop/frontend/assets/index.css">

    <style>
        body { margin: 0; background: #f1f5f9; font-family: Inter, system-ui, sans-serif; }
        .initial-loader { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; flex-direction: column; gap: 16px; }
        .initial-loader .spinner { width: 32px; height: 32px; border: 3px solid rgba(99,102,241,.2); border-top-color: #6366f1; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans antialiased">
    <div id="app">
        <div class="initial-loader"><div class="spinner"></div></div>
    </div>

    <script>
        window.csrf_token = "{{ csrf_token }}";
        window.site_name = "{{ site_name }}";
        if (!window.frappe) window.frappe = {};
        frappe.boot = {{ boot }};
    </script>
</body>
</html>
